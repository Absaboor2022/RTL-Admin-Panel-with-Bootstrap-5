<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ورود به پنل مدیریت</title>
    <!-- Bootstrap 5 RTL -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet"> -->
    <!-- Font Awesome 6 -->
     <link rel="stylesheet" href="assets/css/booststrap-rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="light-mode">
    <div class="theme-toggle-login" id="themeToggleLogin">
        <i class="fas fa-moon" id="themeIconLogin"></i>
    </div>

    <div class="login-card p-4 p-md-4">
        <div class="login-header">
            <i class="fas fa-gem"></i>
            <h3 class="mt-2">شرکت نوری</h3>
            <p class="text-muted mb-0">پنل مدیریت</p>
            <p class="small text-muted mt-1">لطفاً وارد شوید</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-envelope me-1"></i> ایمیل سازمانی</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="admin@noavaran.com" required autocomplete="email" value="admin@example.com">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-lock me-1"></i> رمز عبور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password" value="123456">
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" style="border-radius: 5px;">
                    <label class="form-check-label small" for="rememberMe">مرا به خاطر بسپار</label>
                </div>
                <a href="#" class="small">فراموشی رمز؟</a>
            </div>
            <button type="submit" class="btn btn-login w-100">
                <i class="fas fa-arrow-left me-2"></i> ورود
            </button>
        </form>

        <div class="divider my-3">یا</div>
        <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-outline-secondary rounded-pill px-3 py-1" style="border-radius: 40px; font-size: 0.8rem;" onclick="alert('ورود با گوگل')">
                <i class="fab fa-google"></i> گوگل
            </button>
            <button class="btn btn-outline-secondary rounded-pill px-3 py-1" style="border-radius: 40px; font-size: 0.8rem;" onclick="alert('ورود با لینکدین')">
                <i class="fab fa-linkedin-in"></i> لینکدین
            </button>
        </div>
        <p class="text-center text-muted mt-3 small">
            <i class="fas fa-shield-alt me-1"></i> ورود امن
        </p>
    </div>

    <script>
        const toggleBtn = document.getElementById('themeToggleLogin');
        const themeIcon = document.getElementById('themeIconLogin');
        
        const setTheme = (theme) => {
            document.body.classList.remove('light-mode', 'dark-mode');
            document.body.classList.add(theme);
            localStorage.setItem('loginTheme', theme);
            themeIcon.className = theme === 'dark-mode' ? 'fas fa-sun' : 'fas fa-moon';
        };
        
        const savedTheme = localStorage.getItem('loginTheme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else {
            const adminTheme = localStorage.getItem('adminTheme');
            if (adminTheme) setTheme(adminTheme);
        }
        
        toggleBtn.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark-mode');
            setTheme(isDark ? 'light-mode' : 'dark-mode');
        });
        
        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (email && password) {
                const btn = document.querySelector('.btn-login');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>';
                btn.disabled = true;
                
                setTimeout(() => {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email);
                    window.location.href = 'admin-panel.html';
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 800);
            } else {
                alert('لطفاً ایمیل و رمز عبور را وارد کنید');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
